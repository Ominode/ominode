    <meta name="theme-color" content="#11161B" />
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <script>
      // Anti-FOUC: paint the celestial preset (or the user's stored preset)
      // on <body> before React mounts, so the default night canvas never
      // flashes the base light theme. The preset attribute is normally
      // written by ThemeCustomizationProvider after mount; this just moves
      // it before first paint.
      (function () {
        try {
          var m = /(?:^|;\s*)theme_preset=([^;]+)/.exec(document.cookie)
          document.body.setAttribute(
            'data-theme-preset',
            m ? m[1] : 'celestial-twilight'
          )
        } catch (e) {
          /* empty */
        }
      })()
    </script>
    <div id="root"></div>
  </body>
</html>
