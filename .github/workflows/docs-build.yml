name: Publish docs site image

on:
  push:
    branches:
      - main
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & push docs image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: docs-site
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/chain-works/ominode-docs:latest
            ghcr.io/chain-works/ominode-docs:${{ github.sha }}
          cache-from: type=gha,scope=ominode-docs
          cache-to: type=gha,mode=max,scope=ominode-docs
